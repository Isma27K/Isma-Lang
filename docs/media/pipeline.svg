<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="262" viewBox="0 0 1140 262" role="img" aria-label="How Isma compiles: lexer, parser, type checker, MIR with reference counting, LLVM codegen, clang with the C runtime, native binary; the checker also powers the VS Code language server">
<title>How Isma compiles a program</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.box{fill:#f6f8fa;stroke:#d0d7de} .hot{fill:#dafbe1;stroke:#1a7f37} .blue{fill:#ddf4ff;stroke:#0969da}
.t{fill:#1f2328} .m{fill:#59636e} .a{stroke:#1a7f37;stroke-width:1.6;fill:none} .ah{fill:#1a7f37}
@media (prefers-color-scheme:dark){
.box{fill:#161b22;stroke:#30363d} .hot{fill:#0f2a19;stroke:#3fb950} .blue{fill:#0c2340;stroke:#4493f8}
.t{fill:#e6edf3} .m{fill:#9198a1} .a{stroke:#3fb950} .ah{fill:#3fb950}}
</style>
<rect class="box" x="20" y="92" width="120" height="58" rx="9"/>
<text class="t" x="80.0" y="117" text-anchor="middle" font-size="13.5" font-weight="600">your .isma file</text>
<text class="m" x="80.0" y="135" text-anchor="middle" font-size="11.5">source code</text>
<rect class="box" x="160" y="92" width="120" height="58" rx="9"/>
<text class="t" x="220.0" y="117" text-anchor="middle" font-size="13.5" font-weight="600">Lexer</text>
<text class="m" x="220.0" y="135" text-anchor="middle" font-size="11.5">→ tokens</text>
<path class="a" d="M142 121.0L156 121.0" marker-end="url(#ah)"/>
<rect class="box" x="300" y="92" width="120" height="58" rx="9"/>
<text class="t" x="360.0" y="117" text-anchor="middle" font-size="13.5" font-weight="600">Parser</text>
<text class="m" x="360.0" y="135" text-anchor="middle" font-size="11.5">→ syntax tree</text>
<path class="a" d="M282 121.0L296 121.0" marker-end="url(#ah)"/>
<rect class="box" x="440" y="92" width="120" height="58" rx="9"/>
<text class="t" x="500.0" y="117" text-anchor="middle" font-size="13.5" font-weight="600">Type checker</text>
<text class="m" x="500.0" y="135" text-anchor="middle" font-size="11.5">strict types + lints</text>
<path class="a" d="M422 121.0L436 121.0" marker-end="url(#ah)"/>
<rect class="box" x="580" y="92" width="120" height="58" rx="9"/>
<text class="t" x="640.0" y="117" text-anchor="middle" font-size="13.5" font-weight="600">MIR + ARC</text>
<text class="m" x="640.0" y="135" text-anchor="middle" font-size="11.5">Perceus ref counting</text>
<path class="a" d="M562 121.0L576 121.0" marker-end="url(#ah)"/>
<rect class="box" x="720" y="92" width="120" height="58" rx="9"/>
<text class="t" x="780.0" y="117" text-anchor="middle" font-size="13.5" font-weight="600">Codegen</text>
<text class="m" x="780.0" y="135" text-anchor="middle" font-size="11.5">→ LLVM IR</text>
<path class="a" d="M702 121.0L716 121.0" marker-end="url(#ah)"/>
<rect class="box" x="860" y="92" width="120" height="58" rx="9"/>
<text class="t" x="920.0" y="117" text-anchor="middle" font-size="13.5" font-weight="600">clang -O3</text>
<text class="m" x="920.0" y="135" text-anchor="middle" font-size="11.5">+ small C runtime</text>
<path class="a" d="M842 121.0L856 121.0" marker-end="url(#ah)"/>
<rect class="box hot" x="1000" y="92" width="120" height="58" rx="9"/>
<text class="t" x="1060.0" y="117" text-anchor="middle" font-size="13.5" font-weight="600">native binary</text>
<text class="m" x="1060.0" y="135" text-anchor="middle" font-size="11.5">runs on its own</text>
<path class="a" d="M982 121.0L996 121.0" marker-end="url(#ah)"/>
<rect class="box" x="230.0" y="8" width="120" height="58" rx="9"/>
<text class="t" x="290.0" y="33" text-anchor="middle" font-size="13.5" font-weight="600">stdlib/time.isma</text>
<text class="m" x="290.0" y="51" text-anchor="middle" font-size="11.5">written in Isma</text>
<path class="a" d="M290.0 68L290.0 88" marker-end="url(#ah)"/>
<text class="m" x="298.0" y="82.0" font-size="11.5">import time</text>
<rect class="box" x="440" y="192" width="120" height="58" rx="9"/>
<text class="t" x="500.0" y="217" text-anchor="middle" font-size="13.5" font-weight="600">isma lsp</text>
<text class="m" x="500.0" y="235" text-anchor="middle" font-size="11.5">language server</text>
<path class="a" d="M500.0 152L500.0 188" marker-end="url(#ah)"/>
<rect class="box blue" x="610" y="192" width="200" height="58" rx="9"/>
<text class="t" x="710.0" y="217" text-anchor="middle" font-size="13.5" font-weight="600">VS Code</text>
<text class="m" x="710.0" y="235" text-anchor="middle" font-size="11.5">squiggles · hover · completion</text>
<path class="a" d="M562 221.0L606 221.0" marker-end="url(#ah)"/>
<rect class="box" x="845" y="192" width="150" height="58" rx="9"/>
<text class="t" x="920.0" y="217" text-anchor="middle" font-size="13.5" font-weight="600">C runtime</text>
<text class="m" x="920.0" y="235" text-anchor="middle" font-size="11.5">allocator · cycle collector</text>
<path class="a" d="M920.0 188L920.0 152" marker-end="url(#ah)"/>
</svg>
