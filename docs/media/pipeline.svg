<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="300" viewBox="0 0 1180 300" role="img" aria-label="How Tarn compiles: lexer, parser, type checker, MIR with reference counting, LLVM codegen, clang with the C runtime, native binary; the checker also powers the VS Code language server">
<title>How Tarn compiles a program</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c4c4c4"/></marker></defs>
<rect x=".5" y=".5" width="1179" height="299" rx="18" fill="#ffffff" stroke="#e6e6e6"/>
<g font-family="Inter,'SF Pro Text','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif">
<rect x="30" y="112" width="122" height="60" rx="10" fill="#ffffff" stroke="#e6e6e6"/>
<text x="91.0" y="138" text-anchor="middle" font-size="13.5" font-weight="500" fill="#111111">your .tr file</text>
<text x="91.0" y="156" text-anchor="middle" font-size="11.5" fill="#6e6e6e">source code</text>
<rect x="172" y="112" width="122" height="60" rx="10" fill="#ffffff" stroke="#e6e6e6"/>
<text x="233.0" y="138" text-anchor="middle" font-size="13.5" font-weight="500" fill="#111111">Lexer</text>
<text x="233.0" y="156" text-anchor="middle" font-size="11.5" fill="#6e6e6e">tokens</text>
<path d="M154 142.0L168 142.0" stroke="#c4c4c4" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
<rect x="314" y="112" width="122" height="60" rx="10" fill="#ffffff" stroke="#e6e6e6"/>
<text x="375.0" y="138" text-anchor="middle" font-size="13.5" font-weight="500" fill="#111111">Parser</text>
<text x="375.0" y="156" text-anchor="middle" font-size="11.5" fill="#6e6e6e">syntax tree</text>
<path d="M296 142.0L310 142.0" stroke="#c4c4c4" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
<rect x="456" y="112" width="122" height="60" rx="10" fill="#ffffff" stroke="#e6e6e6"/>
<text x="517.0" y="138" text-anchor="middle" font-size="13.5" font-weight="500" fill="#111111">Type checker</text>
<text x="517.0" y="156" text-anchor="middle" font-size="11.5" fill="#6e6e6e">strict types, lints</text>
<path d="M438 142.0L452 142.0" stroke="#c4c4c4" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
<rect x="598" y="112" width="122" height="60" rx="10" fill="#ffffff" stroke="#e6e6e6"/>
<text x="659.0" y="138" text-anchor="middle" font-size="13.5" font-weight="500" fill="#111111">MIR + ARC</text>
<text x="659.0" y="156" text-anchor="middle" font-size="11.5" fill="#6e6e6e">reference counting</text>
<path d="M580 142.0L594 142.0" stroke="#c4c4c4" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
<rect x="740" y="112" width="122" height="60" rx="10" fill="#ffffff" stroke="#e6e6e6"/>
<text x="801.0" y="138" text-anchor="middle" font-size="13.5" font-weight="500" fill="#111111">Codegen</text>
<text x="801.0" y="156" text-anchor="middle" font-size="11.5" fill="#6e6e6e">LLVM IR</text>
<path d="M722 142.0L736 142.0" stroke="#c4c4c4" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
<rect x="882" y="112" width="122" height="60" rx="10" fill="#ffffff" stroke="#e6e6e6"/>
<text x="943.0" y="138" text-anchor="middle" font-size="13.5" font-weight="500" fill="#111111">clang -O3</text>
<text x="943.0" y="156" text-anchor="middle" font-size="11.5" fill="#6e6e6e">+ a small C runtime</text>
<path d="M864 142.0L878 142.0" stroke="#c4c4c4" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
<rect x="1024" y="112" width="122" height="60" rx="10" fill="#111111" stroke="#111111"/>
<text x="1085.0" y="138" text-anchor="middle" font-size="13.5" font-weight="500" fill="#ffffff">native binary</text>
<text x="1085.0" y="156" text-anchor="middle" font-size="11.5" fill="#bdbdbd">runs on its own</text>
<path d="M1006 142.0L1020 142.0" stroke="#c4c4c4" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
<rect x="219.0" y="24" width="170" height="60" rx="10" fill="#ffffff" stroke="#e6e6e6"/>
<text x="304.0" y="50" text-anchor="middle" font-size="13.5" font-weight="500" fill="#111111">imported .tr files</text>
<text x="304.0" y="68" text-anchor="middle" font-size="11.5" fill="#6e6e6e">yours and the stdlib</text>
<path d="M304.0 86L304.0 108" stroke="#c4c4c4" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
<text x="312.0" y="101.0" font-size="11.5" fill="#a8a8a8">import</text>
<rect x="456" y="214" width="122" height="60" rx="10" fill="#ffffff" stroke="#e6e6e6"/>
<text x="517.0" y="240" text-anchor="middle" font-size="13.5" font-weight="500" fill="#111111">tarn lsp</text>
<text x="517.0" y="258" text-anchor="middle" font-size="11.5" fill="#6e6e6e">language server</text>
<path d="M517.0 174L517.0 210" stroke="#c4c4c4" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
<rect x="628" y="214" width="200" height="60" rx="10" fill="#ffffff" stroke="#e6e6e6"/>
<text x="728.0" y="240" text-anchor="middle" font-size="13.5" font-weight="500" fill="#111111">VS Code</text>
<text x="728.0" y="258" text-anchor="middle" font-size="11.5" fill="#6e6e6e">squiggles, hover, completion</text>
<path d="M580 244.0L624 244.0" stroke="#c4c4c4" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
<rect x="867" y="214" width="152" height="60" rx="10" fill="#ffffff" stroke="#e6e6e6"/>
<text x="943.0" y="240" text-anchor="middle" font-size="13.5" font-weight="500" fill="#111111">C runtime</text>
<text x="943.0" y="258" text-anchor="middle" font-size="11.5" fill="#6e6e6e">allocator, cycle collector</text>
<path d="M943.0 210L943.0 174" stroke="#c4c4c4" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>
</g>
</svg>
