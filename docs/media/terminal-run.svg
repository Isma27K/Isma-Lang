<svg xmlns="http://www.w3.org/2000/svg" width="659" height="290" viewBox="0 0 659 290" role="img" aria-label="run a script, or build a native binary">
<title>run a script, or build a native binary</title>
<defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".05"/></filter></defs>
<style>
.r{animation:show .01s linear both}
.c{animation:blink 1.1s steps(1) infinite}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.r,.t,.c{animation:none!important}}
</style>
<rect x="10" y="10" width="639" height="270" rx="14" fill="#ffffff" stroke="#e6e6e6" filter="url(#s)"/>
<line x1="10" y1="50" x2="649" y2="50" stroke="#f0f0ef"/>
<circle cx="32" cy="30.0" r="4.5" fill="#e6e6e6"/><circle cx="48" cy="30.0" r="4.5" fill="#e6e6e6"/><circle cx="64" cy="30.0" r="4.5" fill="#e6e6e6"/>
<text x="329.5" y="34.0" text-anchor="middle" font-family="Inter,'SF Pro Text','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif" font-size="12" fill="#a8a8a8">run a script, or build a native binary</text>
<g transform="translate(10 10)" font-family="'JetBrains Mono','SF Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#2b2b2b">
<g class="r" style="animation-delay:0.40s"><text x="28" y="79.5" fill="#a8a8a8">$</text></g>
<g class="t" style="animation:type 0.46s steps(13) 0.55s both"><text y="79.5" xml:space="preserve"><tspan x="44.2" fill="#111111">tarn hello.tr</tspan></text></g>
<g class="r" style="animation-delay:1.31s"><text y="99.5" xml:space="preserve"><tspan x="28.0">Hello from Tarn.</tspan></text></g>
<g class="r" style="animation-delay:1.34s"><text x="28" y="119.5" fill="#a8a8a8">$</text></g>
<g class="t" style="animation:type 0.84s steps(24) 1.49s both"><text y="119.5" xml:space="preserve"><tspan x="44.2" fill="#111111">tarn build fib.tr -o fib</tspan></text></g>
<g class="r" style="animation-delay:2.63s"><text x="28" y="139.5" fill="#a8a8a8">$</text></g>
<g class="t" style="animation:type 0.30s steps(5) 2.78s both"><text y="139.5" xml:space="preserve"><tspan x="44.2" fill="#111111">./fib</tspan></text></g>
<g class="r" style="animation-delay:3.38s"><text y="159.5" xml:space="preserve"><tspan x="28.0">sum of fib(0..20) = 10945</tspan></text></g>
<g class="r" style="animation-delay:3.42s"><text y="179.5" xml:space="preserve"><tspan x="28.0">fib(30) = 832040</tspan></text></g>
<g class="r" style="animation-delay:3.45s"><text x="28" y="199.5" fill="#a8a8a8">$</text></g>
<g class="t" style="animation:type 0.95s steps(27) 3.60s both"><text y="199.5" xml:space="preserve"><tspan x="44.2" fill="#111111">file -b fib | cut -d, -f1-2</tspan></text></g>
<g class="r" style="animation-delay:4.85s"><text y="219.5" xml:space="preserve"><tspan x="28.0">ELF 64-bit LSB pie executable, x86-64</tspan></text></g>
<g class="r" style="animation-delay:5.08s"><text x="28" y="239.5" fill="#a8a8a8">$</text><rect class="c" x="44.2" y="228.0" width="1.6" height="16.5" fill="#111111"/></g>
</g>
</svg>
