<svg xmlns="http://www.w3.org/2000/svg" width="647" height="243" viewBox="0 0 647 243" role="img" aria-label="isma: run a script, or build a native binary">
<title>isma: run a script, or build a native binary</title>
<style>
.r{animation:show .01s linear both}
.c{animation:blink 1.05s steps(1) infinite}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.r,.t,.c{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="646" height="242" rx="10" fill="#0b0f0d" stroke="#22302a"/>
<path d="M10 0.5h627a9.5 9.5 0 0 1 9.5 9.5v26h-646v-26a9.5 9.5 0 0 1 9.5-9.5z" fill="#141b17"/>
<circle cx="20" cy="18.0" r="6" fill="#ff5f56"/><circle cx="38" cy="18.0" r="6" fill="#ffbd2e"/><circle cx="56" cy="18.0" r="6" fill="#27c93f"/>
<text x="323.5" y="22.0" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#7d8a83">isma: run a script, or build a native binary</text>
<g font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#d7dae0">
<g class="r" style="animation-delay:0.40s"><text x="20" y="68.0" fill="#39ff78" font-weight="700">$</text></g>
<g class="t" style="animation:type 0.53s steps(15) 0.55s both"><text y="68.0" xml:space="preserve"><tspan x="36.9" fill="#d7dae0">isma hello.isma</tspan></text></g>
<g class="r" style="animation-delay:1.38s"><text y="87.0" xml:space="preserve"><tspan x="20.0">Hello from Isma!</tspan></text></g>
<g class="r" style="animation-delay:1.41s"><text x="20" y="106.0" fill="#39ff78" font-weight="700">$</text></g>
<g class="t" style="animation:type 0.91s steps(26) 1.56s both"><text y="106.0" xml:space="preserve"><tspan x="36.9" fill="#d7dae0">isma build fib.isma -o fib</tspan></text></g>
<g class="r" style="animation-delay:2.77s"><text x="20" y="125.0" fill="#39ff78" font-weight="700">$</text></g>
<g class="t" style="animation:type 0.30s steps(5) 2.92s both"><text y="125.0" xml:space="preserve"><tspan x="36.9" fill="#d7dae0">./fib</tspan></text></g>
<g class="r" style="animation-delay:3.52s"><text y="144.0" xml:space="preserve"><tspan x="20.0">sum of fib(0..20) = 10945</tspan></text></g>
<g class="r" style="animation-delay:3.56s"><text y="163.0" xml:space="preserve"><tspan x="20.0">fib(30) = 832040</tspan></text></g>
<g class="r" style="animation-delay:3.59s"><text x="20" y="182.0" fill="#39ff78" font-weight="700">$</text></g>
<g class="t" style="animation:type 0.95s steps(27) 3.74s both"><text y="182.0" xml:space="preserve"><tspan x="36.9" fill="#d7dae0">file -b fib | cut -d, -f1-2</tspan></text></g>
<g class="r" style="animation-delay:4.99s"><text y="201.0" xml:space="preserve"><tspan x="20.0">ELF 64-bit LSB pie executable, x86-64</tspan></text></g>
<g class="r" style="animation-delay:5.22s"><text x="20" y="220.0" fill="#39ff78" font-weight="700">$</text><rect class="c" x="36.9" y="209.0" width="8.4" height="16" fill="#39ff78"/></g>
</g>
</svg>
