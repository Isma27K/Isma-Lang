<svg xmlns="http://www.w3.org/2000/svg" width="647" height="243" viewBox="0 0 647 243" role="img" aria-label="isma: the time module">
<title>isma: the time module</title>
<style>
.r{animation:show .01s linear both}
.c{animation:blink 1.05s steps(1) infinite}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.r,.t,.c{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="646" height="242" rx="10" fill="#0b0f0d" stroke="#22302a"/>
<path d="M10 0.5h627a9.5 9.5 0 0 1 9.5 9.5v26h-646v-26a9.5 9.5 0 0 1 9.5-9.5z" fill="#141b17"/>
<circle cx="20" cy="18.0" r="6" fill="#ff5f56"/><circle cx="38" cy="18.0" r="6" fill="#ffbd2e"/><circle cx="56" cy="18.0" r="6" fill="#27c93f"/>
<text x="323.5" y="22.0" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#7d8a83">isma: the time module</text>
<g font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#d7dae0">
<g class="r" style="animation-delay:0.40s"><text x="20" y="68.0" fill="#39ff78" font-weight="700">$</text></g>
<g class="t" style="animation:type 0.53s steps(15) 0.55s both"><text y="68.0" xml:space="preserve"><tspan x="36.9" fill="#d7dae0">isma clock.isma</tspan></text></g>
<g class="r" style="animation-delay:1.38s"><text y="87.0" xml:space="preserve"><tspan x="20.0">UTC now:      2026-11-14T11:35:01.150944057Z</tspan></text></g>
<g class="r" style="animation-delay:1.41s"><text y="106.0" xml:space="preserve"><tspan x="20.0">Pretty:       Saturday, 14 November 2026 at 11:35</tspan></text></g>
<g class="r" style="animation-delay:1.44s"><text y="125.0" xml:space="preserve"><tspan x="20.0">Unix seconds: 1794656101</tspan></text></g>
<g class="r" style="animation-delay:1.48s"><text y="144.0" xml:space="preserve"><tspan x="20.0">New year in 47 days and 12 hours</tspan></text></g>
<g class="r" style="animation-delay:1.51s"><text y="163.0" xml:space="preserve"><tspan x="20.0">Moon landing: 20 Jul 1969, 20:17 UTC, a Sunday</tspan></text></g>
<g class="r" style="animation-delay:1.55s"><text y="182.0" xml:space="preserve"><tspan x="20.0">That was 57 years ago</tspan></text></g>
<g class="r" style="animation-delay:1.58s"><text y="201.0" xml:space="preserve"><tspan x="20.0">Summed to 14999995 in 4 ms</tspan></text></g>
<g class="r" style="animation-delay:1.82s"><text x="20" y="220.0" fill="#39ff78" font-weight="700">$</text><rect class="c" x="36.9" y="209.0" width="8.4" height="16" fill="#39ff78"/></g>
</g>
</svg>
