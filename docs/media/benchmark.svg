<svg xmlns="http://www.w3.org/2000/svg" width="760" height="848" viewBox="0 0 760 848" role="img" aria-label="Benchmark: Isma vs Rust vs Python run times">
<title>Benchmark: Isma vs Rust vs Python run times</title>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.p{fill:#0b0b0b} .s{fill:#52514e} .axis{stroke:#c3c2b7;stroke-width:1}
.b0{fill:#2a78d6}.b1{fill:#eb6834}.b2{fill:#1baf7a}
@media (prefers-color-scheme:dark){.p{fill:#f0efec} .s{fill:#c3c2b7} .axis{stroke:#383835} .b0{fill:#3987e5}.b1{fill:#d95926}.b2{fill:#199e70}}
</style>
<text class="p" x="0" y="20" font-size="17" font-weight="600">Run time in milliseconds (lower is better)</text>
<text class="s" x="0" y="42" font-size="12.5">Best of 3 runs, same machine (AMD Ryzen 5 5500), 2026-11-14. Rust built with rustc -O.</text>
<rect class="b0" x="0" y="58" width="12" height="12" rx="3"/>
<text class="s" x="18" y="69" font-size="12.5">Isma</text>
<rect class="b1" x="70.0" y="58" width="12" height="12" rx="3"/>
<text class="s" x="88.0" y="69" font-size="12.5">Rust</text>
<rect class="b2" x="140.0" y="58" width="12" height="12" rx="3"/>
<text class="s" x="158.0" y="69" font-size="12.5">Python</text>
<text class="p" x="0" y="96" font-size="13.5" font-weight="600">fib(35): 30 million recursive function calls</text>
<text class="s" x="0" y="114" font-size="12">Isma is 23× faster than Python; Rust is 1.4× faster than Isma</text>
<text class="p" x="64" y="143" font-size="12.5" text-anchor="end">Isma</text>
<path class="b0" d="M76.0 128.0h20.4a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-20.4z"><title>Isma: 38 ms</title></path>
<text class="s" x="108.4" y="143" font-size="12.5">38 ms</text>
<text class="p" x="64" y="173" font-size="12.5" text-anchor="end">Rust</text>
<path class="b1" d="M76.0 158.0h14.0a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-14.0z"><title>Rust: 28 ms</title></path>
<text class="s" x="102.0" y="173" font-size="12.5">28 ms</text>
<text class="p" x="64" y="203" font-size="12.5" text-anchor="end">Python</text>
<path class="b2" d="M76.0 188.0h556.0a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-556.0z"><title>Python: 872 ms</title></path>
<text class="s" x="644.0" y="203" font-size="12.5">872 ms</text>
<line class="axis" x1="75.5" y1="124" x2="75.5" y2="212"/>
<text class="p" x="0" y="248" font-size="13.5" font-weight="600">Sieve of Eratosthenes up to 10 million (List[Bool])</text>
<text class="s" x="0" y="266" font-size="12">Isma is 41× faster than Python; Rust is 1.2× faster than Isma</text>
<text class="p" x="64" y="295" font-size="12.5" text-anchor="end">Isma</text>
<path class="b0" d="M76.0 280.0h9.6a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-9.6z"><title>Isma: 49 ms</title></path>
<text class="s" x="97.6" y="295" font-size="12.5">49 ms</text>
<text class="p" x="64" y="325" font-size="12.5" text-anchor="end">Rust</text>
<path class="b1" d="M76.0 310.0h7.4a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-7.4z"><title>Rust: 41 ms</title></path>
<text class="s" x="95.4" y="325" font-size="12.5">41 ms</text>
<text class="p" x="64" y="355" font-size="12.5" text-anchor="end">Python</text>
<path class="b2" d="M76.0 340.0h556.0a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-556.0z"><title>Python: 2012 ms</title></path>
<text class="s" x="644.0" y="355" font-size="12.5">2,012 ms</text>
<line class="axis" x1="75.5" y1="276" x2="75.5" y2="364"/>
<text class="p" x="0" y="400" font-size="13.5" font-weight="600">Building a 15 MB string from 2 million f-strings</text>
<text class="s" x="0" y="418" font-size="12">Isma is 2.3× faster than Python; Rust is 1.4× faster than Isma</text>
<text class="p" x="64" y="447" font-size="12.5" text-anchor="end">Isma</text>
<path class="b0" d="M76.0 432.0h237.7a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-237.7z"><title>Isma: 120 ms</title></path>
<text class="s" x="325.7" y="447" font-size="12.5">120 ms</text>
<text class="p" x="64" y="477" font-size="12.5" text-anchor="end">Rust</text>
<path class="b1" d="M76.0 462.0h163.2a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-163.2z"><title>Rust: 83 ms</title></path>
<text class="s" x="251.2" y="477" font-size="12.5">83 ms</text>
<text class="p" x="64" y="507" font-size="12.5" text-anchor="end">Python</text>
<path class="b2" d="M76.0 492.0h556.0a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-556.0z"><title>Python: 278 ms</title></path>
<text class="s" x="644.0" y="507" font-size="12.5">278 ms</text>
<line class="axis" x1="75.5" y1="428" x2="75.5" y2="516"/>
<text class="p" x="0" y="552" font-size="13.5" font-weight="600">Moving a Vec2 particle 5 million steps (pos = pos.add(vel))</text>
<text class="s" x="0" y="570" font-size="12">Isma is 54× faster than Python; Rust is 2.3× faster than Isma</text>
<text class="p" x="64" y="599" font-size="12.5" text-anchor="end">Isma</text>
<path class="b0" d="M76.0 584.0h6.4a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-6.4z"><title>Isma: 21 ms</title></path>
<text class="s" x="94.4" y="599" font-size="12.5">21 ms</text>
<text class="p" x="64" y="629" font-size="12.5" text-anchor="end">Rust</text>
<path class="b1" d="M76.0 614.0h2.2a2.2320637732506645 2.2320637732506645 0 0 1 2.2320637732506645 2.2320637732506645v15.5a2.2320637732506645 2.2320637732506645 0 0 1 -2.2320637732506645 2.2320637732506645h-2.2z"><title>Rust: 9 ms</title></path>
<text class="s" x="88.5" y="629" font-size="12.5">9 ms</text>
<text class="p" x="64" y="659" font-size="12.5" text-anchor="end">Python</text>
<path class="b2" d="M76.0 644.0h556.0a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-556.0z"><title>Python: 1129 ms</title></path>
<text class="s" x="644.0" y="659" font-size="12.5">1,129 ms</text>
<line class="axis" x1="75.5" y1="580" x2="75.5" y2="668"/>
<text class="p" x="0" y="704" font-size="13.5" font-weight="600">Binary trees: building and walking 3 million enum nodes</text>
<text class="s" x="0" y="722" font-size="12">Isma is 7.8× faster than Python; Isma is 2.2× faster than Rust</text>
<text class="p" x="64" y="751" font-size="12.5" text-anchor="end">Isma</text>
<path class="b0" d="M76.0 736.0h68.0a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-68.0z"><title>Isma: 41 ms</title></path>
<text class="s" x="156.0" y="751" font-size="12.5">41 ms</text>
<text class="p" x="64" y="781" font-size="12.5" text-anchor="end">Rust</text>
<path class="b1" d="M76.0 766.0h157.5a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-157.5z"><title>Rust: 92 ms</title></path>
<text class="s" x="245.5" y="781" font-size="12.5">92 ms</text>
<text class="p" x="64" y="811" font-size="12.5" text-anchor="end">Python</text>
<path class="b2" d="M76.0 796.0h556.0a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-556.0z"><title>Python: 319 ms</title></path>
<text class="s" x="644.0" y="811" font-size="12.5">319 ms</text>
<line class="axis" x1="75.5" y1="732" x2="75.5" y2="820"/>
</svg>
