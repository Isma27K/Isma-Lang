<text x="36" y="150" font-size="13.5" font-weight="500" fill="#111111">fib(35): 30 million recursive function calls</text>
<text x="36" y="169" font-size="12" fill="#a8a8a8">23× faster than Python · Rust is 1.4× faster</text>
