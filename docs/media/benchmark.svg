<text x="122.8" y="107" font-size="12.5" fill="#6e6e6e">Rust</text>
<rect x="177.6" y="98" width="10" height="10" rx="2" fill="#dcdcdb"/>
<text x="193.6" y="107" font-size="12.5" fill="#6e6e6e">Python</text>
