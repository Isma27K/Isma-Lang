<text x="130" y="220" font-size="12" text-anchor="end" fill="#6e6e6e">Rust</text>
<path d="M144.0 209.0h13.7a3 3 0 0 1 3 3v8.0a3 3 0 0 1 -3 3h-13.7z" fill="#a9a9a9"><title>Rust: 28 ms</title></path>
