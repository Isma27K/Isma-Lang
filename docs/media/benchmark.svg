<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392" role="img" aria-label="Benchmark: Isma vs Rust vs Python run times">
<title>Benchmark: Isma vs Rust vs Python run times</title>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.p{fill:#0b0b0b} .s{fill:#52514e} .axis{stroke:#c3c2b7;stroke-width:1}
.b0{fill:#2a78d6}.b1{fill:#eb6834}.b2{fill:#1baf7a}
@media (prefers-color-scheme:dark){.p{fill:#f0efec} .s{fill:#c3c2b7} .axis{stroke:#383835} .b0{fill:#3987e5}.b1{fill:#d95926}.b2{fill:#199e70}}
</style>
<text class="p" x="0" y="20" font-size="17" font-weight="600">Run time in milliseconds (lower is better)</text>
<text class="s" x="0" y="42" font-size="12.5">Best of 3 runs, same machine (AMD Ryzen 5 5500), 2026-11-14. Rust built with rustc -O.</text>
<rect class="b0" x="0" y="58" width="12" height="12" rx="3"/>
<text class="s" x="18" y="69" font-size="12.5">Isma</text>
<rect class="b1" x="70.0" y="58" width="12" height="12" rx="3"/>
<text class="s" x="88.0" y="69" font-size="12.5">Rust</text>
<rect class="b2" x="140.0" y="58" width="12" height="12" rx="3"/>
<text class="s" x="158.0" y="69" font-size="12.5">Python</text>
<text class="p" x="0" y="96" font-size="13.5" font-weight="600">fib(35): 30 million recursive function calls</text>
<text class="s" x="0" y="114" font-size="12">Isma is 22× faster than Python; Rust is 1.5× faster than Isma</text>
<text class="p" x="64" y="143" font-size="12.5" text-anchor="end">Isma</text>
<path class="b0" d="M76.0 128.0h21.7a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-21.7z"><title>Isma: 44 ms</title></path>
<text class="s" x="109.7" y="143" font-size="12.5">44 ms</text>
<text class="p" x="64" y="173" font-size="12.5" text-anchor="end">Rust</text>
<path class="b1" d="M76.0 158.0h12.9a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-12.9z"><title>Rust: 29 ms</title></path>
<text class="s" x="100.9" y="173" font-size="12.5">29 ms</text>
<text class="p" x="64" y="203" font-size="12.5" text-anchor="end">Python</text>
<path class="b2" d="M76.0 188.0h556.0a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-556.0z"><title>Python: 959 ms</title></path>
<text class="s" x="644.0" y="203" font-size="12.5">959 ms</text>
<line class="axis" x1="75.5" y1="124" x2="75.5" y2="212"/>
<text class="p" x="0" y="248" font-size="13.5" font-weight="600">Sieve of Eratosthenes up to 10 million (List[Bool])</text>
<text class="s" x="0" y="266" font-size="12">Isma is 46× faster than Python; Rust is 1.1× faster than Isma</text>
<text class="p" x="64" y="295" font-size="12.5" text-anchor="end">Isma</text>
<path class="b0" d="M76.0 280.0h8.2a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-8.2z"><title>Isma: 47 ms</title></path>
<text class="s" x="96.2" y="295" font-size="12.5">47 ms</text>
<text class="p" x="64" y="325" font-size="12.5" text-anchor="end">Rust</text>
<path class="b1" d="M76.0 310.0h7.1a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-7.1z"><title>Rust: 43 ms</title></path>
<text class="s" x="95.1" y="325" font-size="12.5">43 ms</text>
<text class="p" x="64" y="355" font-size="12.5" text-anchor="end">Python</text>
<path class="b2" d="M76.0 340.0h556.0a4 4 0 0 1 4 4v12.0a4 4 0 0 1 -4 4h-556.0z"><title>Python: 2163 ms</title></path>
<text class="s" x="644.0" y="355" font-size="12.5">2,163 ms</text>
<line class="axis" x1="75.5" y1="276" x2="75.5" y2="364"/>
</svg>
