<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1054" viewBox="0 0 760 1054" role="img" aria-label="Benchmark: Tarn vs Rust vs Python run times">
<title>Benchmark: Tarn vs Rust vs Python run times</title>
<rect x=".5" y=".5" width="759" height="1053" rx="18" fill="#ffffff" stroke="#e6e6e6"/>
<g font-family="Inter,'SF Pro Text','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif">
<text x="36" y="56" font-size="18" font-weight="500" fill="#111111">Run time, in milliseconds</text>
<text x="36" y="80" font-size="12.5" fill="#6e6e6e">Lower is better. Best of 3 runs on one machine (AMD Ryzen 5 5500), Rust built with rustc -O.</text>
<rect x="36" y="98" width="10" height="10" rx="2" fill="#111111"/>
<text x="52" y="107" font-size="12.5" fill="#6e6e6e">Tarn</text>
